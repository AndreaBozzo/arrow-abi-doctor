[package]
name = "abi-coordinator"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Supervises consumer workers so that a consumer crash is an observed datum"

[dependencies]
# Result lines are written by workers this crate does not own -- the Arrow C++
# and DuckDB adapters are C++, the dataprof one is Python -- so the parser has
# to be a real one. A hand-rolled reader that mis-parses a line would drop a
# case silently and report it as `not-run`, which is the one failure mode this
# whole component exists to prevent.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
