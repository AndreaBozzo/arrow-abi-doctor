name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint / format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Versions come from pyproject's dev group and are pinned there. An
      # unpinned formatter makes this job fail when a runner image updates
      # rather than when someone changes code, which trains people to ignore it.
      - name: install dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev
      - name: ruff
        run: |
          ruff check .
          ruff format --check .
      - name: mypy
        run: mypy .
      # docs/coverage-matrix.md is normative and quotes N. This recomputes N
      # from tools/coverage_matrix.py and fails if the two have drifted, so
      # the published figure stays a computed one rather than a maintained one.
      - name: coverage model
        run: python tools/coverage_matrix.py --check
      # The report's branches that no real run can reach yet: with three of the
      # five lifecycles inexpressible, no real run is ever N/N, so the claim and
      # a mid-run kill are checked over synthetic runs of the whole model.
      - name: differential report
        run: python tools/test_diff_report.py
      # arrow_abi.h is excluded by .clang-format-ignore: it is vendored verbatim
      # and a diff against upstream has to stay meaningful.
      - name: clang-format
        run: |
          clang-format --dry-run --Werror \
            libabi/src/*.c libabi/src/*.h libabi/include/abi/*.h \
            libabi/tests/*.c libabi/tests/*.h tools/*.c \
            adapters/dataprof/*.c adapters/common/*.c adapters/common/*.h \
            adapters/null/*.c adapters/faulty/*.c

  linux-gcc:
    name: linux / gcc / -Werror
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build
      - name: configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DABI_WERROR=ON
      - name: build
        run: cmake --build build
      - name: test
        run: ctest --test-dir build --output-on-failure
      # Corpus A is generated, not committed, so nothing else in the tree would
      # notice a generator that quietly produced fewer cases than the model has
      # cells. This regenerates it and audits the result against
      # tools/coverage_matrix.py: per-lifecycle counts, the tuple set itself,
      # case-id uniqueness, and a file behind every manifest row.
      - name: generate and audit corpus A
        run: python3 tools/gen_corpus.py
      # The dual digest's central claim, over the corpus rather than over the
      # hand-built pairs the C tests use: the logical digest must partition the
      # corpus by (type, length-class, null-pattern) alone, because offset,
      # alignment and buffer-state are layout and not data. docs/digest.md.
      - name: check the digest partition
        run: python3 tools/digest_property.py

  sanitizers:
    name: linux / asan + ubsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build
      - name: configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DABI_SANITIZERS=ON -DABI_WERROR=ON
      - name: build
        run: cmake --build build
      # The truncation and corruption sweeps only mean anything under a
      # sanitizer: without one, "no out-of-bounds read" is a claim, not a
      # measurement.
      - name: test
        run: ctest --test-dir build --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      # 1880 cases through the builder, encoder and decoder is far wider input
      # than the fixtures reach, and the generator is the one place that walks
      # every buffer-state and alignment class in bulk. Under ASan a leak or an
      # out-of-bounds write here is a failure rather than a plausible run.
      - name: generate corpus A under the sanitizers
        run: python3 tools/gen_corpus.py
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

  valgrind:
    name: linux / valgrind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build valgrind
      - name: configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DABI_WERROR=ON
      - name: build
        run: cmake --build build
      - name: memcheck
        run: |
          valgrind --error-exitcode=9 --leak-check=full \
                   --show-leak-kinds=all --errors-for-leak-kinds=all -q \
                   ./build/libabi/abicase_tests

  cross-arch:
    name: cross-arch / s390x (big-endian)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build gcc-s390x-linux-gnu qemu-user-static
      # The M0 gate. A native integer serialized by accident is invisible on
      # every little-endian machine and passes every test above; only running
      # the code on a big-endian host finds it.
      - name: cross-architecture check
        run: ./tools/cross-arch-check.sh

  m05-smoke:
    name: m0.5 / dataprof + pyarrow smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The published wheel, not a source build: this job is a regression guard
      # on the adapter and the reconstructor, not a claim about any particular
      # dataprof commit. Findings get confirmed against a branch build by hand
      # before they go anywhere near an issue.
      - name: install consumers
        run: python -m pip install --quiet dataprof pyarrow setuptools
      - name: build the _abicase extension
        run: python setup.py build_ext --inplace
        working-directory: adapters/dataprof
      - name: smoke
        run: python run_smoke.py
        working-directory: adapters/dataprof
      # "0 leaks" is one of the few things this harness asserts, so the line
      # between a leak and bytes a live capsule still owns gets its own check.
      # Its consumers are synthetic, so it needs no consumer library.
      - name: leak accounting
        run: python check_leak_accounting.py
        working-directory: adapters/dataprof
      # Corpus A read back as Arrow arrays rather than as files. gen_corpus.py
      # proves the container is well-formed and would pass just as happily with
      # the validity bitmap written most-significant-bit first; check_corpus.py
      # imports every case and compares every slot against the model. It needs a
      # consumer, so it lives in this job rather than in linux-gcc.
      - name: build the corpus generator and the faulty worker
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build --target abicase-gen abi-worker-faulty abi-worker-null
      - name: generate corpus A
        run: python tools/gen_corpus.py
      - name: read corpus A back with pyarrow
        run: python check_corpus.py
        working-directory: adapters/dataprof
      # Silent divergence is the defect class a crash detector cannot see, and
      # the logical digest is the claim that it is observable anyway. The faulty
      # worker drops ArrowArray.offset on the way back; pyarrow predicts, cell
      # by cell, whether that changes the data; the digest must agree on every
      # one, and a worker that stops dropping the offset fails it.
      - name: the logical digest catches a dropped offset
        run: python check_digest_divergence.py
        working-directory: adapters/dataprof
      # The first differential pair under the coordinator (issue #17): pyarrow
      # and dataprof over Corpus A in their own processes, then an injected
      # panic that has to become a result line and an injected SIGSEGV that has
      # to be attributed to its case. Checked from run.json and the result
      # streams, not from what the coordinator printed.
      - name: build the coordinator
        run: cargo build --quiet -p abi-coordinator
      - name: the python worker under the coordinator
        run: python check_py_worker.py
        working-directory: adapters/dataprof
      # The differential report over a real run (issue #16): the null control,
      # both voices of the pair, and the faulty worker in drop-offset mode as a
      # planted silent divergence. --expect-divergence fails unless the planted
      # divergence surfaces as `disagree`, and only as that; the real
      # consumers' verdicts are printed, never pinned.
      - name: differential report over the pair, with a planted divergence
        run: |
          ABI_FAULTY_MODE=drop-offset cargo run --quiet -p abi-coordinator -- \
            --worker null=./build/adapters/abi-worker-null \
            --worker pyarrow=python \
            --worker-arg pyarrow=adapters/dataprof/abi_worker.py \
            --worker-arg pyarrow=--consumer --worker-arg pyarrow=pyarrow \
            --worker dataprof=python \
            --worker-arg dataprof=adapters/dataprof/abi_worker.py \
            --worker-arg dataprof=--consumer --worker-arg dataprof=dataprof \
            --worker planted=./build/adapters/abi-worker-faulty \
            --cases corpus/a --out "$RUNNER_TEMP/pair"
          python tools/diff_report.py "$RUNNER_TEMP/pair/run.json" \
            --expect-divergence planted

  coordinator:
    name: linux / worker isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build
      # The isolation tests drive real worker processes, so the C targets have
      # to exist. They fail rather than skip when the build is missing: a test
      # that quietly skips has never failed and guards nothing.
      - name: build the workers
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DABI_WERROR=ON
          cmake --build build
      - name: rust format and lint
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
      # Includes the acceptance condition of issue #1: a worker is actually
      # segfaulted and the run has to complete anyway, reporting it as
      # signal=SIGSEGV while the other consumer still produces a full result.
      - name: isolation tests
        run: cargo test
      # The library is tested above; this runs the shipped binary over the real
      # corpus and checks the artifact it wrote, not the log it printed. A CI
      # step that greps its own echoed output tests the echo.
      - name: end to end over corpus A
        run: |
          python3 tools/gen_corpus.py
          ABI_FAULTY_AT=40 cargo run --quiet -p abi-coordinator -- \
            --worker null=./build/adapters/abi-worker-null \
            --worker faulty=./build/adapters/abi-worker-faulty \
            --cases corpus/a --limit 100 --out "$RUNNER_TEMP/run"
          python3 tools/check_isolation_run.py "$RUNNER_TEMP/run/run.json" \
            --cases 100 --crash-at 40 --expect-sent-only
      # The header's `sanitizers` is an array of names, and only a build with
      # sanitizers on can tell that from one comma-joined string: everywhere
      # else the list is empty and both shapes look alike. So the check is
      # pointed at a build that has them on. The run doubles as the workers
      # themselves under ASan and UBSan.
      - name: header shape under the sanitizers
        run: |
          cmake -S . -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DABI_SANITIZERS=ON -DABI_WERROR=ON
          cmake --build build-asan --target abi-worker-null
          cargo run --quiet -p abi-coordinator -- \
            --worker null=./build-asan/adapters/abi-worker-null \
            --cases corpus/a --limit 20 --out "$RUNNER_TEMP/asan-run"
          python3 tools/check_isolation_run.py "$RUNNER_TEMP/asan-run/run.json" \
            --expect-sanitizers address,undefined
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

  windows-msvc:
    name: windows / msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: build
        run: cmake --build build --config RelWithDebInfo
      - name: test
        run: ctest --test-dir build --build-config RelWithDebInfo --output-on-failure
      # Windows has no signals: the coordinator reads a fault from the exception
      # code in the exit status, 0xC0000005 where POSIX reports SIGSEGV. That is
      # a separate code path, and the linux job never runs it. These are the
      # same isolation tests, against the MSVC workers built above, including
      # the one that really does crash a worker.
      - name: isolation tests
        run: cargo test

  windows-smoke:
    name: windows / msvc / dataprof + pyarrow smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The project claims portability and demonstrated it for libabi but not
      # for the first adapter, whose CPython extension had only ever been built
      # on Linux. setup.py now picks flags per compiler, because cl.exe accepts
      # -std=c11 as an unknown option it ignores with a warning: passing the GCC
      # flags through builds C89-with-extensions and says so only in passing.
      - name: install consumers
        run: python -m pip install --quiet dataprof pyarrow setuptools
      - name: build the _abicase extension
        run: python setup.py build_ext --inplace
        working-directory: adapters/dataprof
      - name: smoke
        run: python run_smoke.py
        working-directory: adapters/dataprof
      # "0 leaks" is one of the few things this harness asserts, so the line
      # between a leak and bytes a live capsule still owns gets its own check.
      # Its consumers are synthetic, so it needs no consumer library.
      - name: leak accounting
        run: python check_leak_accounting.py
        working-directory: adapters/dataprof
